<div class="parent">
  <div class="register-card">
    <div class="brand-logo">Candidate Registration</div>
    <p class="text-center text-muted mb-4">Create your account to access recordings.</p>

    <form [formGroup]="candidateForm" (ngSubmit)="onRegister()">
      <div class="mb-3">
        <label for="fullName" class="form-label small fw-bold">Full Name</label>
        <input
          type="text"
          id="fullName"
          formControlName="fullName"
          class="form-control"
          placeholder="Your full name"
          autocomplete="name"
        />
      </div>

      <div class="mb-3">
        <label for="email" class="form-label small fw-bold">Email Address</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="name@example.com"
          autocomplete="email"
        />
      </div>

      <div class="mb-3">
        <label for="mobileNumber" class="form-label small fw-bold">Mobile Number</label>
        <input
          type="tel"
          id="mobileNumber"
          formControlName="mobileNumber"
          class="form-control"
          placeholder="Enter mobile number"
          autocomplete="tel"
        />
      </div>

      <div class="mb-4">
        <label for="password" class="form-label small fw-bold">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Create a password"
          autocomplete="new-password"
        />
      </div>

      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-register" [disabled]="isSubmitting()">
          Register
        </button>
        <button type="button" class="btn btn-outline-secondary" (click)="goToLogin()">
          Back to Login
        </button>
      </div>
    </form>
  </div>
</div>
