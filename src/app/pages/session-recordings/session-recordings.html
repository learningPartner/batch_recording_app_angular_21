<div class="container-fluid py-5 main-container">
    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card form-card">
                <div class="card-body p-4">
                    <div class="section-header">
                        <i class="fas fa-plus-circle"></i>
                        <h4>Add New Session</h4>
                    </div>

                    <form>
                         
                        <div class="mb-3">
                            <label for="batchId" class="form-label">
                                <i class="fas fa-layer-group me-2"></i>Select Batch
                            </label>
                            <select  [field]="sessionForm.batchId" class="form-select" id="batchId">
                                <option value="">Select a batch</option>
                                @for (item of batchList$| async; track $index) {
                                      <option [value]="item.batchId">{{item.batchName}}</option> 
                                }
                              
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="topicName" class="form-label">
                                <i class="fas fa-book me-2"></i>Topic Name
                            </label>
                            <input type="text" [field]="sessionForm.topicName" class="form-control" id="topicName" placeholder="Enter topic name">
                        </div>

                        <div class="mb-3">
                            <label for="topicDescription" class="form-label">
                                <i class="fas fa-align-left me-2"></i>Topic Description
                            </label>
                            <textarea [field]="sessionForm.topicDescription" class="form-control" id="topicDescription" rows="2"
                                placeholder="Enter topic description"></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="youtubeVideoId" class="form-label">
                                <i class="fab fa-youtube me-2"></i>YouTube Video ID
                            </label>
                            <input type="text" [field]="sessionForm.youtubeVideoId" class="form-control" id="youtubeVideoId" placeholder="e.g., dQw4w9WgXcQ">
                        </div>

                        <div class="mb-3">
                            <label for="durationInMinutes" class="form-label">
                                <i class="fas fa-hourglass-half me-2"></i>Duration (Minutes)
                            </label>
                            <input type="number" [field]="sessionForm.durationInMinutes" class="form-control" id="durationInMinutes"
                                placeholder="Enter duration">
                        </div>

                        <div class="mb-3">
                            <label for="sessionDate" class="form-label">
                                <i class="fas fa-calendar me-2"></i>Session Date
                            </label>
                            <input type="date" [field]="sessionForm.sessionDate" class="form-control" id="sessionDate">
                        </div>

                        <div class="mb-4">
                            <label for="displayOrder" class="form-label">
                                <i class="fas fa-list-ol me-2"></i>Display Order
                            </label>
                            <input type="number" [field]="sessionForm.displayOrder" class="form-control" id="displayOrder"
                                placeholder="Enter display order">
                        </div>

                        <div class="d-grid gap-2">
                            <button type="button" (click)="onSaveSession()" class="btn btn-custom btn-success-custom">
                                <i class="fas fa-save me-2"></i>Create Session
                            </button>
                            <button type="button" class="btn btn-custom btn-secondary-custom">
                                <i class="fas fa-redo me-2"></i>Reset Form
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card content-card">
                <div class="card-body p-4">
                    <div class="section-header">
                        <i class="fas fa-list"></i>
                        <h4>Sessions List</h4>
                    </div>

                    <div class="row g-3">
                        @for (item of records(); track $index) {
                             <div class="col-md-6">
                            <div class="session-card">
                                <div class="session-card-header">
                                    <div class="topic-title">{{item.topicName}}</div>
                                    <span class="batch-info">{{item.batchName}}</span>
                                </div>
                                <div class="session-card-body"> 
                                    <div class="session-meta"> 
                                        <div class="meta-item">
                                            <i class="fas fa-calendar-alt"></i>
                                            <span>{{item.sessionDate| date:'dd-MMM-yy'}}</span>
                                        </div>
                                    </div>
                                    <a target="_blank" [href]="item.youtubeVideoId" class="youtube-link">
                                        <i class="fab fa-youtube"></i>
                                       {{item.youtubeVideoId}}
                                    </a>
                                </div>
                                <div class="session-card-footer">
                                    <button class="action-btn btn-warning-custom">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <button class="action-btn btn-danger-custom">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        }
                       

                       
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
